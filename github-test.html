<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест каталога GitHub — PAVEL DARK ARTIFACTS</title><style>
:root{color-scheme:dark}body{margin:0;background:#101013;color:#eee;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px 18px}h1{font:32px Georgia,serif;color:#c4a477}p{line-height:1.6}.muted{color:#a8a5a0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:25px}.card{background:#1c1b1e;border:1px solid #504332;border-radius:10px;overflow:hidden}.card img{width:100%;aspect-ratio:4/5;object-fit:cover}.card .body{padding:15px}.card h2{font:23px Georgia,serif;margin:0 0 8px}.card a{color:#d6b987}.empty{height:260px;display:grid;place-items:center;color:#c4a477}.status{padding:12px;border:1px solid #544b3d;border-radius:8px}a{color:#d6b987}</style></head><body><main><p><a href="./">← Вернуться к тестовой галерее</a></p><h1>Тест: каталог без Supabase</h1><p class="muted">Эта страница загружает данные из файла GitHub. Авторизация и редактирование пока не подключены. Основной сайт не изменён.</p><p id="status" class="status">Загружаем каталог…</p><div id="grid" class="grid"></div></main><script>
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
fetch("./catalog-github.json?ts="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(data=>{if(!Array.isArray(data))throw Error("Неверный формат каталога");document.getElementById("status").textContent="Каталог GitHub загружен: "+data.length+" работы";document.getElementById("grid").innerHTML=data.map(p=>'<article class="card">'+(p.image?'<img loading="lazy" src="'+safe(p.image)+'" alt="'+safe(p.title)+'">':'<div class="empty">Фото не добавлено</div>')+'<div class="body"><h2>'+safe(p.title)+'</h2><p>'+safe(p.category)+'</p><p>'+(Number(p.price)>0?Number(p.price).toLocaleString("ru-RU")+" ₽":"Цена по запросу")+'</p><a target="_blank" rel="noopener" href="https://t.me/CriptoWi">Уточнить в Telegram ↗</a></div></article>').join("")}).catch(e=>{document.getElementById("status").textContent="Ошибка загрузки: "+e.message});
</script></body></html>
