<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка настроек · PAVEL DARK ARTIFACTS</title><style>:root{color-scheme:dark}body{margin:0;background:#111114;color:#e8e3d9;font:16px system-ui}main{max-width:700px;margin:auto;padding:22px}h1,h2{font-family:Georgia,serif;color:#c7aa7a}section{background:#1c1b1e;border:1px solid #493d30;border-radius:12px;padding:20px;margin:20px 0}.value{white-space:pre-wrap;overflow-wrap:anywhere}.label{font-size:13px;color:#b7aa97;margin-bottom:5px}a{color:#d4b783}</style></head><body><main><a href="./admin-settings-test.html">← К тестовым настройкам</a><h1>Предпросмотр сохранённых настроек</h1><p>Здесь показаны значения из GitHub без необходимости вводить токен. Основной сайт не изменён.</p><div id="preview">Загружаем настройки…</div></main><script>
const groups=[["Логотип",["brand_main","brand_sub"]],["Главная страница",["hero_kicker","hero_title","hero_accent","hero_text"]],["О мастере",["about_title","about_accent","about_text"]],["Коллекция",["works_title"]],["Подход",["manifesto_title","manifesto_accent","manifesto_text"]],["Контакты",["contact_title","contact_accent","contact_text","contact_phone","contact_max"]],["Меню",["nav_works","nav_about","nav_contact"]]];
const labels={brand_main:"Название",brand_sub:"Подпись",hero_kicker:"Надпись над заголовком",hero_title:"Заголовок",hero_accent:"Золотая строка",hero_text:"Описание",about_title:"Заголовок",about_accent:"Золотая строка",about_text:"Описание",works_title:"Заголовок",manifesto_title:"Заголовок",manifesto_accent:"Золотая строка",manifesto_text:"Описание",contact_title:"Заголовок",contact_accent:"Золотая строка",contact_text:"Описание",contact_phone:"Телефон",contact_max:"MAX",nav_works:"Работы",nav_about:"О мастере",nav_contact:"Контакты"};
(async()=>{const root=document.getElementById("preview");try{const r=await fetch("./site-settings.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();root.replaceChildren();for(const [name,keys] of groups){const section=document.createElement("section");const h=document.createElement("h2");h.textContent=name;section.append(h);for(const key of keys){const p=document.createElement("p");const l=document.createElement("div");l.className="label";l.textContent=labels[key]||key;const v=document.createElement("div");v.className="value";v.textContent=data[key]||"Не задано";p.append(l,v);section.append(p)}root.append(section)}}catch(e){root.textContent="Не удалось загрузить настройки: "+e.message}})();
</script></body></html>
